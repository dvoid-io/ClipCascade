# Release pipeline for this fork (a local/* branch: never sent upstream).
#
# Upstream attaches hand-built binaries to each GitHub release; there is no build
# workflow to contribute to. This fork releases only from v* tags cut by CI, built
# from deploy/production (mirror + patch/* + local/*), and publishes the desktop
# assets under the same names upstream uses so installers only change repo + tag:
#   ClipCascade_Linux.tar.xz                  source tree, top-level dir "ClipCascade"
#   ClipCascade-Apple_macOS.ARM_M-Series.zip  ClipCascade.app, Apple silicon
#   ClipCascade-Apple_macOS.Intel-Series.zip  ClipCascade.app, Intel
# The .app is ad-hoc signed (unnotarized, as upstream's). The server jar is not
# built here; the server ships from its own image.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SRC: ClipCascade_Desktop/src

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package source tarball (same layout as upstream's ClipCascade_Linux.tar.xz)
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          rsync -a \
            --exclude 'build/' --exclude 'dist/' --exclude '*.egg-info' \
            --exclude '__pycache__/' --exclude '*.pyc' --exclude '*.spec' \
            --exclude '.gitignore' --exclude 'requirements_*.txt' \
            "$SRC"/ "$stage/ClipCascade"/
          cp "$SRC/requirements_linux.txt" "$stage/ClipCascade/requirements.txt"
          cp LICENSE "$stage/ClipCascade/LICENSE"
          printf '%s\n' "https://github.com/Sathvik-Rao/ClipCascade" > "$stage/ClipCascade/help.txt"
          tar -C "$stage" -cJf ClipCascade_Linux.tar.xz ClipCascade
          tar -tJf ClipCascade_Linux.tar.xz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ClipCascade_Linux.tar.xz
          path: ClipCascade_Linux.tar.xz
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: ClipCascade-Apple_macOS.ARM_M-Series.zip
          - runner: macos-15-intel
            asset: ClipCascade-Apple_macOS.Intel-Series.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pick a python with tkinter (the spec hidden-imports it)
        run: |
          set -euo pipefail
          if python -c 'import tkinter'; then
            py="$(command -v python)"
          else
            brew install python-tk@3.12
            py="$(brew --prefix python@3.12)/bin/python3.12"
            "$py" -c 'import tkinter'
          fi
          "$py" -m venv "$RUNNER_TEMP/venv"
          echo "PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Build ClipCascade.app
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements_mac.txt pyinstaller
          "$PY" -m PyInstaller --noconfirm ClipCascade_macos.spec
          test -x dist/ClipCascade.app/Contents/MacOS/ClipCascade

      - name: Stamp version, ad-hoc sign, zip
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" \
            dist/ClipCascade.app/Contents/Info.plist
          codesign --force --deep --sign - dist/ClipCascade.app
          codesign --verify --deep --strict dist/ClipCascade.app
          ditto -c -k --keepParent dist/ClipCascade.app "$GITHUB_WORKSPACE/${{ matrix.asset }}"
          unzip -l "$GITHUB_WORKSPACE/${{ matrix.asset }}" | head -n 8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Create the GitHub release with all three assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l assets
          test "$(ls assets | wc -l)" -eq 3
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "Desktop client built by CI from deploy/production at $GITHUB_SHA (upstream 3.2.0 + this fork's patch/* and local/* branches)." \
            assets/*
